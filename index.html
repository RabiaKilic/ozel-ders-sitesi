<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matematik & Geometri Özel Ders</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --ink:#12233D;
    --ink-2:#1B2F4E;
    --paper:#F3EFE6;
    --paper-2:#EAE3D3;
    --accent:#B8791E;
    --accent-bg:#D9A441;
    --line:#C9BFA8;
    --text:#1B2230;
    --text-soft:#4B5468;
    --green:#2F6F62;
    --green-bg:#E4EEEA;
    --red:#A23E33;
    --red-bg:#F3E4E1;
    --amber-bg:#FBF0DC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--text);
    font-family:'Century Gothic','Avenir Next','Futura',-apple-system,sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{
    font-family:'Palatino Linotype','Iowan Old Style','Book Antiqua',Georgia,serif;
    font-weight:400;
    margin:0;
    color:var(--ink);
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select,textarea{font-family:inherit;font-size:15px;color:var(--text);}
  code{font-family:'Courier New',monospace;background:var(--paper-2);padding:2px 6px;border-radius:2px;}
  ::selection{background:var(--accent-bg);}

  /* ---------- layout shells ---------- */
  .wrap{max-width:1080px;margin:0 auto;padding:0 28px;}
  .narrow{max-width:640px;margin:0 auto;padding:0 28px;}

  /* ---------- nav ---------- */
  #topnav{
    background:var(--ink);
    color:var(--paper);
    position:sticky;top:0;z-index:50;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  #topnav .wrap{
    display:flex;align-items:center;justify-content:space-between;
    height:66px;
  }
  .brand{
    font-family:'Palatino Linotype','Iowan Old Style',Georgia,serif;
    font-size:20px;letter-spacing:0.3px;
    display:flex;align-items:center;gap:10px;
  }
  .brand .mark{
    width:26px;height:26px;flex:none;
  }
  .navlinks{display:flex;gap:6px;align-items:center;}
  .navlinks button{
    padding:9px 16px;border-radius:2px;font-size:14.5px;
    color:var(--paper);opacity:0.82;transition:opacity .15s;
  }
  .navlinks button:hover{opacity:1;}
  .navlinks button.active{
    opacity:1;
    box-shadow:inset 0 -2px 0 var(--accent-bg);
  }
  .navlinks .cta{
    background:var(--accent-bg);color:var(--ink);opacity:1;
    padding:9px 18px;border-radius:2px;font-weight:600;
  }
  #mobileNavToggle{display:none;color:var(--paper);font-size:22px;padding:4px;}
  @media (max-width:720px){
    .navlinks{display:none;flex-direction:column;position:absolute;top:66px;left:0;right:0;background:var(--ink);padding:10px 20px 18px;gap:2px;}
    .navlinks.open{display:flex;}
    .navlinks button, .navlinks .cta{width:100%;text-align:left;}
    #mobileNavToggle{display:block;}
  }

  /* ---------- hero ---------- */
  .hero{
    background:var(--ink);
    color:var(--paper);
    padding:72px 0 84px;
    position:relative;
    overflow:hidden;
  }
  .hero .wrap{display:grid;grid-template-columns:1.15fr 0.85fr;gap:56px;align-items:center;}
  @media (max-width:840px){ .hero .wrap{grid-template-columns:1fr;gap:40px;} }
  .hero .eyebrow-line{
    display:flex;align-items:center;gap:10px;margin-bottom:20px;color:var(--accent-bg);
    font-size:14px;
  }
  .hero .eyebrow-line svg{width:16px;height:16px;flex:none;}
  .hero h1{
    font-size:44px;line-height:1.18;color:var(--paper);max-width:520px;
  }
  @media (max-width:520px){ .hero h1{font-size:32px;} }
  .hero p.lead{
    margin-top:20px;font-size:17px;color:#C9D1DE;max-width:460px;
  }
  .hero .hero-actions{margin-top:32px;display:flex;gap:14px;flex-wrap:wrap;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:13px 24px;border-radius:2px;font-size:15px;font-weight:600;
    border:1px solid transparent;transition:transform .12s, background .15s;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent-bg);color:var(--ink);}
  .btn-primary:hover{background:#E4B255;}
  .btn-outline{border-color:rgba(243,239,230,0.4);color:var(--paper);}
  .btn-outline:hover{border-color:var(--paper);}
  .btn-ink{background:var(--ink);color:var(--paper);}
  .btn-ink:hover{background:var(--ink-2);}
  .btn[disabled]{opacity:0.5;cursor:not-allowed;}

  .photo-badge{
    width:100%;aspect-ratio:1/1;max-width:340px;margin:0 auto;
    border:1px solid rgba(217,164,65,0.5);border-radius:2px;
    display:flex;align-items:center;justify-content:center;
    position:relative;background:var(--ink-2);
    overflow:hidden;
  }
  .photo-badge img{width:100%;height:100%;object-fit:cover;}
  .photo-badge .monogram{
    font-family:'Palatino Linotype',Georgia,serif;font-size:96px;color:var(--accent-bg);
  }
  .photo-badge .corner{position:absolute;width:22px;height:22px;border:1.5px solid var(--accent-bg);opacity:.7;}
  .photo-badge .corner.tl{top:14px;left:14px;border-right:none;border-bottom:none;}
  .photo-badge .corner.br{bottom:14px;right:14px;border-left:none;border-top:none;}

  /* ---------- sections ---------- */
  section.block{padding:64px 0;}
  section.block.alt{background:var(--paper-2);}
  .section-head{max-width:600px;margin-bottom:36px;}
  .section-head h2{font-size:29px;}
  .section-head p{color:var(--text-soft);margin-top:10px;font-size:15.5px;}
  hr.rule{border:none;border-top:1px solid var(--line);margin:0;}

  /* ---------- about ---------- */
  .about-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;}
  @media (max-width:760px){.about-grid{grid-template-columns:1fr;}}
  .stat-row{display:flex;gap:34px;margin-top:26px;flex-wrap:wrap;}
  .stat{border-left:2px solid var(--accent-bg);padding-left:14px;}
  .stat .num{font-family:'Palatino Linotype',Georgia,serif;font-size:26px;color:var(--ink);display:block;}
  .stat .lbl{font-size:13.5px;color:var(--text-soft);}
  .achv-list{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-direction:column;gap:12px;}
  .achv-list li{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--text);}
  .achv-list svg{flex:none;width:16px;height:16px;margin-top:4px;color:var(--green);}

  /* ---------- categories ---------- */
  .cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);}
  @media (max-width:860px){.cat-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.cat-grid{grid-template-columns:1fr;}}
  .cat-cell{background:var(--paper);padding:26px 24px;min-height:150px;display:flex;flex-direction:column;gap:10px;}
  .cat-cell .shape{width:20px;height:20px;flex:none;color:var(--accent);}
  .cat-cell h3{font-size:18px;}
  .cat-cell .lvl{font-size:13px;color:var(--accent);font-weight:600;}
  .cat-cell p{font-size:14px;color:var(--text-soft);margin:0;}

  /* ---------- steps ---------- */
  .steps{display:flex;gap:0;counter-reset:step;}
  @media (max-width:760px){.steps{flex-direction:column;}}
  .step{flex:1;padding:0 26px 0 0;position:relative;}
  .step:not(:last-child){border-right:1px solid var(--line);}
  @media (max-width:760px){.step:not(:last-child){border-right:none;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:20px;}}
  .step .stepnum{font-family:'Palatino Linotype',Georgia,serif;font-size:34px;color:var(--accent-bg);-webkit-text-stroke:1px var(--accent);}
  .step h4{margin-top:8px;font-size:16.5px;}
  .step p{color:var(--text-soft);font-size:14px;margin-top:6px;}

  /* ---------- booking form ---------- */
  .card{background:#fff;border:1px solid var(--line);padding:30px;}
  .field{margin-bottom:20px;}
  .field label{display:block;font-size:13.5px;color:var(--text-soft);margin-bottom:7px;}
  .field input, .field select, .field textarea{
    width:100%;padding:10px 2px;border:none;border-bottom:1.5px solid var(--line);
    background:transparent;outline:none;transition:border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-bottom-color:var(--accent);}
  .field textarea{resize:vertical;min-height:60px;}
  .radio-row{display:flex;gap:18px;}
  .radio-row label{display:flex;align-items:center;gap:6px;font-size:14.5px;color:var(--text);}
  .cat-pick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  @media (max-width:560px){.cat-pick{grid-template-columns:1fr;}}
  .cat-pick-btn{
    text-align:left;border:1.5px solid var(--line);padding:12px 14px;border-radius:2px;
    font-size:14px;transition:border-color .15s, background .15s;
  }
  .cat-pick-btn .t{display:block;font-weight:600;color:var(--ink);}
  .cat-pick-btn .s{display:block;font-size:12.5px;color:var(--text-soft);margin-top:2px;}
  .cat-pick-btn.selected{border-color:var(--accent);background:var(--amber-bg);}
  .slot-grid{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px;}
  .slot-btn{
    border:1.5px solid var(--line);padding:9px 15px;border-radius:2px;font-size:14px;
  }
  .slot-btn.selected{border-color:var(--green);background:var(--green-bg);color:var(--green);font-weight:600;}
  .empty-note{font-size:13.5px;color:var(--text-soft);font-style:italic;padding:8px 0;}
  .msg{padding:12px 16px;border-radius:2px;font-size:14px;margin-bottom:18px;}
  .msg.ok{background:var(--green-bg);color:var(--green);}
  .msg.err{background:var(--red-bg);color:var(--red);}

  /* ---------- lookup ---------- */
  .booking-row{border:1px solid var(--line);padding:16px 18px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px;}
  .booking-row .meta{font-size:13px;color:var(--text-soft);margin-top:4px;}
  .status-pill{font-size:12px;padding:4px 10px;border-radius:12px;font-weight:600;white-space:nowrap;}
  .status-beklemede{background:var(--amber-bg);color:var(--accent);}
  .status-onaylandı{background:var(--green-bg);color:var(--green);}
  .status-iptal{background:var(--red-bg);color:var(--red);}

  /* ---------- footer ---------- */
  footer{background:var(--ink);color:#9FADC2;padding:36px 0;font-size:13.5px;}
  footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;}

  /* ---------- admin ---------- */
  .admin-shell{display:grid;grid-template-columns:220px 1fr;min-height:70vh;}
  @media (max-width:760px){.admin-shell{grid-template-columns:1fr;}}
  .admin-side{background:var(--ink);color:var(--paper);padding:26px 0;}
  .admin-side button{display:block;width:100%;text-align:left;padding:12px 26px;font-size:14.5px;opacity:.78;}
  .admin-side button.active{opacity:1;background:var(--ink-2);border-left:3px solid var(--accent-bg);}
  .admin-side .who{padding:0 26px 16px;font-size:12px;color:#9FADC2;border-bottom:1px solid rgba(255,255,255,0.1);margin-bottom:10px;word-break:break-all;}
  .admin-main{padding:34px 30px;background:var(--paper);}
  .admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:10px;}
  table.admin-table{width:100%;border-collapse:collapse;font-size:14px;}
  table.admin-table th{text-align:left;font-size:12.5px;color:var(--text-soft);border-bottom:1.5px solid var(--line);padding:8px 10px;}
  table.admin-table td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  .icon-btn{padding:5px 10px;border:1px solid var(--line);border-radius:2px;font-size:12.5px;margin-right:6px;white-space:nowrap;}
  .icon-btn.confirm{border-color:var(--green);color:var(--green);}
  .icon-btn.cancel{border-color:var(--red);color:var(--red);}
  .avail-grid{display:grid;grid-template-columns:110px repeat(13,1fr);gap:4px;align-items:center;font-size:12px;margin-top:16px;min-width:760px;}
  .avail-grid .head{font-weight:600;text-align:center;color:var(--text-soft);}
  .avail-grid .daylabel{font-weight:600;}
  .avail-cell{width:26px;height:26px;border:1.5px solid var(--line);margin:0 auto;border-radius:2px;}
  .avail-cell.on{background:var(--green);border-color:var(--green);}
  .avail-scroll{overflow-x:auto;padding-bottom:6px;}
  .weekcal-nav{display:flex;align-items:center;gap:14px;margin:8px 0 4px;flex-wrap:wrap;}
  .weekcal-nav .wk-label{font-weight:600;font-size:14.5px;color:var(--ink);}
  .weekcal-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--text-soft);margin:10px 0 4px;}
  .weekcal-legend span{display:inline-flex;align-items:center;gap:6px;}
  .weekcal-legend i{width:13px;height:13px;border-radius:2px;display:inline-block;border:1.5px solid var(--line);}
  .weekcal-legend i.lg-off{background:#DCD6C6;border-color:#DCD6C6;}
  .weekcal-legend i.lg-free{background:#fff;}
  .weekcal-legend i.lg-pending{background:var(--amber-bg);border-color:var(--accent-bg);}
  .weekcal-legend i.lg-confirmed{background:var(--green);border-color:var(--green);}
  .weekcal-grid{display:grid;grid-template-columns:70px repeat(7,1fr);gap:3px;font-size:11.5px;margin-top:10px;min-width:720px;}
  .weekcal-grid .wc-head{font-weight:600;text-align:center;color:var(--text-soft);padding:4px 2px;}
  .weekcal-grid .wc-head .d{color:var(--ink);font-size:12.5px;}
  .weekcal-grid .wc-time{font-weight:600;color:var(--text-soft);align-self:center;}
  .wc-cell{min-height:30px;border-radius:2px;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;padding:2px;}
  .wc-cell.wc-off{background:#DCD6C6;border-color:#DCD6C6;}
  .wc-cell.wc-pending{background:var(--amber-bg);border-color:var(--accent-bg);color:var(--accent);font-weight:600;}
  .wc-cell.wc-confirmed{background:var(--green);border-color:var(--green);color:#fff;font-weight:600;}
  .wc-cell .rc{font-size:10px;}
  .recur-badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:10px;background:var(--green-bg);color:var(--green);font-weight:600;margin-left:6px;}
  .login-box{max-width:380px;margin:70px auto;background:#fff;border:1px solid var(--line);padding:34px;}
  .small-note{font-size:12.5px;color:var(--text-soft);margin-top:14px;}
  .catadmin-item{border:1px solid var(--line);padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap;}
  textarea#adminBioInput{min-height:110px;}
  .photo-upload-row{display:flex;gap:16px;align-items:center;margin-top:8px;}
  .photo-preview-sm{width:64px;height:64px;border:1px solid var(--line);object-fit:cover;background:var(--ink-2);}
  .filebtn{display:inline-block;padding:9px 16px;border:1.5px solid var(--ink);font-size:13.5px;border-radius:2px;}
  .hidden{display:none !important;}
  .setup-box{max-width:680px;margin:90px auto;padding:0 28px;}
  .setup-box ol{padding-left:20px;}
  .setup-box li{margin-bottom:10px;font-size:15px;}
</style>
</head>

<script>
/* ============================= SUPABASE AYARLARI ============================= */
/* Bu iki değeri kendi Supabase projenin bilgileriyle değiştir:
   Project Settings > API içinde "Project URL" ve "anon public" key bulunur. */
const SUPABASE_URL = "https://tsfyegbogvkaaxsrcibp.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_bhlJUo48oAjh4b9175VYnw_6hGbBmSx";

const supabaseConfigured = SUPABASE_URL.startsWith('https://') && SUPABASE_URL.includes('supabase.co') && SUPABASE_ANON_KEY.length > 20;
const sb = supabaseConfigured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

/* ============================= E-POSTA BİLDİRİMİ (EmailJS) ============================= */
/* Yeni randevu talebi geldiğinde hocaya otomatik e-posta göndermek için
   ücretsiz bir EmailJS hesabı (www.emailjs.com) açıp aşağıdaki 3 değeri
   kendi bilgilerinle değiştir. Boş bıraklırsan e-posta gönderimi sessizce
   atlanır, site yine normal çalışır. Kurulum adımları sohbette anlatıldı. */
const EMAILJS_PUBLIC_KEY  = "M1fItsALup3jG82_j";   // Account > General > Public Key
const EMAILJS_SERVICE_ID  = "service_4zlllyo";   // Email Services > Service ID
const EMAILJS_TEMPLATE_ID = "template_dk7vdjq";   // Email Templates > Template ID
const ADMIN_NOTIFY_EMAIL  = "gokhanhoca77@gmail.com";

const emailjsConfigured = !!(EMAILJS_PUBLIC_KEY && EMAILJS_SERVICE_ID && EMAILJS_TEMPLATE_ID && window.emailjs);
if(emailjsConfigured){ window.emailjs.init(EMAILJS_PUBLIC_KEY); }

async function notifyAdminNewBooking(b, catName){
  if(!emailjsConfigured) return;
  try{
    await window.emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
      to_email: ADMIN_NOTIFY_EMAIL,
      category: catName || "—",
      date: formatDateTR(b.date),
      time: b.time,
      role: b.role === 'veli' ? 'Veli' : 'Öğrenci',
      student_name: b.name,
      grade: b.grade || "—",
      phone: b.phone,
      note: b.note || "—"
    });
  }catch(e){
    console.error("Bildirim e-postası gönderilemedi:", e);
  }
}

/* ============================= STATE ============================= */
const DAY_KEYS = ["pazartesi","sali","carsamba","persembe","cuma","cumartesi","pazar"];
const DAY_LABELS = {pazartesi:"Pazartesi",sali:"Salı",carsamba:"Çarşamba",persembe:"Perşembe",cuma:"Cuma",cumartesi:"Cumartesi",pazar:"Pazar"};
const TIME_OPTIONS = ["09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00","21:00"];
const MAX_LOGIN_ATTEMPTS = 5;
const LOCKOUT_MS = 60000;

function normalizePhone(phone){
  return String(phone||"").replace(/\D/g,"");
}
function isValidTRPhone(phone){
  let d = normalizePhone(phone);
  if(d.startsWith("90") && d.length===12) d = d.slice(2);
  return /^5\d{9}$/.test(d) || /^05\d{9}$/.test(d);
}
function toStoragePhone(phone){
  let d = normalizePhone(phone);
  if(d.startsWith("90") && d.length===12) d = d.slice(2);
  if(!d.startsWith("0") && d.length===10) d = "0"+d;
  return d;
}

const DEFAULT_TUTOR_INFO = {
  name:"Gökhan Kılıç",
  title:"Matematik & Geometri Öğretmeni · 22 Yıl Deneyim",
  bio:"22 yıllık dershane ve kolej deneyimiyle matematik ve geometri dersleri veriyorum.",
  experience:"22 Yıl Deneyim",
  students:"5. Sınıf – Mezun",
  achievements:[],
  phone:"0535 982 15 27",
  photo:null
};

let state = {
  view:"home",
  categories:[],
  availability:{pazartesi:[],sali:[],carsamba:[],persembe:[],cuma:[],cumartesi:[],pazar:[]},
  tutorInfo:DEFAULT_TUTOR_INFO,
  bookings:[],
  isAdmin:false,
  adminEmail:null,
  loginAttempts:0,
  lockUntil:0,
  adminTab:"bookings",
  adminAvailWeekStart: mondayOfWeekISO(new Date().toISOString().slice(0,10)),
  booking:{ categoryId:null, date:"", time:null, role:"ogrenci", name:"", grade:"", phone:"", note:"", freeTimes:null, slotsLoading:false },
  lookupPhone:"",
  lookupResults:null,
  loading:true,
  loadError:null
};

/* ============================= VERİ YÜKLEME (Supabase) ============================= */
async function loadAll(){
  try{
    const [catRes, availRes, tinfoRes] = await Promise.all([
      sb.from('categories').select('*').order('id'),
      sb.from('availability').select('*'),
      sb.from('tutor_info').select('*').eq('id',1).single()
    ]);
    if(catRes.error) throw catRes.error;
    if(availRes.error) throw availRes.error;
    if(tinfoRes.error) throw tinfoRes.error;

    state.categories = catRes.data || [];
    const availObj = {pazartesi:[],sali:[],carsamba:[],persembe:[],cuma:[],cumartesi:[],pazar:[]};
    (availRes.data||[]).forEach(row=>{ availObj[row.day] = row.times || []; });
    state.availability = availObj;
    state.tutorInfo = tinfoRes.data || DEFAULT_TUTOR_INFO;

    const { data: sessionData } = await sb.auth.getSession();
    if(sessionData && sessionData.session){
      state.isAdmin = true;
      state.adminEmail = sessionData.session.user.email;
      await refreshBookings();
    }
  }catch(e){
    console.error("Veri yüklenemedi:", e);
    state.loadError = "Veritabanına bağlanılamadı. Supabase bağlantı bilgilerini ve SQL şemasının çalıştırıldığını kontrol et.";
  }
  state.loading = false;
}
async function refreshBookings(){
  try{
    const { data, error } = await sb.from('bookings').select('*').order('date').order('time_slot');
    if(error) throw error;
    state.bookings = data || [];
  }catch(e){ console.error("Randevular yüklenemedi:", e); state.bookings = state.bookings || []; }
}
async function fetchBookedTimesForDate(date){
  try{
    const { data, error } = await sb.rpc('get_booked_times', { p_date: date });
    if(error) throw error;
    return (data||[]).map(r=>r.time_slot);
  }catch(e){ console.error("Saatler alınamadı:", e); return []; }
}
async function loadFreeTimesForDate(date){
  const wk = weekdayKeyFromDate(date);
  const allTimes = state.availability[wk] || [];
  if(allTimes.length===0) return [];
  const taken = await fetchBookedTimesForDate(date);
  return allTimes.filter(t=>!taken.includes(t));
}

/* ============================= UTIL ============================= */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function weekdayKeyFromDate(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+"T00:00:00");
  const map = {0:"pazar",1:"pazartesi",2:"sali",3:"carsamba",4:"persembe",5:"cuma",6:"cumartesi"};
  return map[d.getDay()];
}
function formatDateTR(dateStr){
  if(!dateStr) return "";
  const d = new Date(dateStr+"T00:00:00");
  return d.toLocaleDateString("tr-TR",{day:"2-digit",month:"long",year:"numeric",weekday:"long"});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function maxDateISO(){ const d = new Date(); d.setDate(d.getDate()+60); return d.toISOString().slice(0,10); }
function addDaysISO(dateStr, n){ const d = new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function mondayOfWeekISO(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  const dow = d.getDay(); // 0=Sun..6=Sat
  const diffToMonday = dow===0 ? -6 : 1-dow;
  d.setDate(d.getDate()+diffToMonday);
  return d.toISOString().slice(0,10);
}
function formatDayShortTR(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  return d.toLocaleDateString("tr-TR",{day:"2-digit",month:"2-digit"});
}
function daysUntil(dateStr){
  const today = new Date(todayISO()+"T00:00:00");
  const target = new Date(dateStr+"T00:00:00");
  return Math.round((target-today)/86400000);
}
function catById(id){ return (state.categories||[]).find(c=>c.id===id); }
function escapeHtml(s){
  return String(s||"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function iconCheck(){ return '<svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9 17.5L20 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
function shapeIcon(i){
  const shapes = [
    '<svg viewBox="0 0 24 24" fill="none"><path d="M3 20 L12 4 L21 20 Z" stroke="currentColor" stroke-width="1.6"/></svg>',
    '<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" stroke="currentColor" stroke-width="1.6"/></svg>',
    '<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/></svg>',
    '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3 L21 12 L12 21 L3 12 Z" stroke="currentColor" stroke-width="1.6"/></svg>'
  ];
  return shapes[i % shapes.length];
}

    html += `<p class="empty-note">Saatleri görmek için önce tarih seç.</p>`;
  } else if(b.slotsLoading || b.freeTimes===null){
    html += `<p class="empty-note">Saatler yükleniyor…</p>`;
  } else {
    const wk = weekdayKeyFromDate(b.date);
    const allTimes = state.availability[wk] || [];
    if(allTimes.length===0){
      html += `<p class="empty-note">${DAY_LABELS[wk]} günleri ders verilmiyor. Lütfen başka bir tarih seç.</p>`;

    TIME_OPTIONS.forEach(t=>{
      const on = (avail[dk]||[]).includes(t);
      grid += `<button type="button" class="avail-cell ${on?'on':''}" data-action="toggle-avail" data-day="${dk}" data-time="${t}"></button>`;
    });
  });

  /* ---- haftalık randevu takvimi (onaylanan/bekleyen randevulara göre) ---- */
  const weekStart = state.adminAvailWeekStart;
  const weekDates = Array.from({length:7}, (_,i)=>addDaysISO(weekStart,i));
  const weekEnd = weekDates[6];
  const bookingsThisWeek = (state.bookings||[]).filter(b=> b.date>=weekStart && b.date<=weekEnd && b.status!=='iptal');

  let weekGrid = `<div class="wc-head"></div>` + weekDates.map((d,i)=>{
    const dk = DAY_KEYS[i];
    return `<div class="wc-head">${DAY_LABELS[dk]}<br><span class="d">${formatDayShortTR(d)}</span></div>`;
  }).join("");

  TIME_OPTIONS.forEach(t=>{
    weekGrid += `<div class="wc-time">${t}</div>`;
    weekDates.forEach((d,i)=>{
      const dk = DAY_KEYS[i];
      const offered = (avail[dk]||[]).includes(t);
      const match = bookingsThisWeek.find(b=> b.date===d && b.time_slot===t);
      let cls = 'wc-cell', label = '';
      if(match){
        cls += match.status==='onaylandı' ? ' wc-confirmed' : ' wc-pending';
        label = (match.name||'').split(' ')[0] || (match.status==='onaylandı'?'Onaylı':'Bekliyor');
        if(match.is_recurring) label += ' <span class="rc">♻</span>';
      } else if(!offered){
        cls += ' wc-off';
      }
      weekGrid += `<div class="${cls}" title="${match?escapeHtml(match.name)+' — '+(match.status==='onaylandı'?'Onaylandı':'Beklemede'):(offered?'Boş':'Müsait değil')}">${label}</div>`;
    });
  });

  const weekLabel = `${formatDayShortTR(weekStart)} – ${formatDayShortTR(weekEnd)}`;

  return `
    <div class="admin-header"><h2>Müsaitlik Ayarları</h2></div>
    <p style="color:var(--text-soft);font-size:14px;">Ders verilebilecek gün ve saatleri işaretle. Öğrenciler randevu alırken sadece burada açık olan saatleri görür. Bu, her hafta tekrar eden genel kuraldır.</p>
    <div class="avail-scroll"><div class="avail-grid">${grid}</div></div>

    <hr class="rule" style="margin:32px 0 20px;">

    <h3 style="font-size:17px;margin-bottom:6px;">Haftalık Randevu Takvimi</h3>
    <p style="color:var(--text-soft);font-size:14px;">Bu, seçtiğin haftadaki gerçek randevuları gösterir — onaylanan ve bekleyen randevular işaretli görünür. Sonraki haftalar, o haftaya ait randevu yoksa boş görünür.</p>
    <div class="weekcal-nav">
      <button class="icon-btn" data-action="avail-week-prev">‹ Önceki Hafta</button>
      <span class="wk-label">${weekLabel}</span>
      <button class="icon-btn" data-action="avail-week-next">Sonraki Hafta ›</button>
      <button class="icon-btn" data-action="avail-week-today">Bu Hafta</button>
    </div>
    <div class="weekcal-legend">
      <span><i class="lg-off"></i> Müsait değil</span>
      <span><i class="lg-free"></i> Boş</span>
      <span><i class="lg-pending"></i> Beklemede</span>
      <span><i class="lg-confirmed"></i> Onaylandı</span>
      <span>♻ Haftalık tekrar eden randevu</span>
    </div>
    <div class="avail-scroll"><div class="weekcal-grid">${weekGrid}</div></div>
  `;
}

/* ============================= ACTIONS ============================= */
async function handleClick(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  if(action==='toggle-mobile-nav'){
    document.getElementById('navlinks').classList.toggle('open');
    return;
  }
  if(action==='go'){
    state.view = el.dataset.view;
    document.getElementById('navlinks').classList.remove('open');
    if(state.view==='admin' && !state.isAdmin){ state.adminTab='bookings'; }
    if(state.view==='lookup'){ state.lookupResults=null; }
    window.scrollTo({top:0,behavior:'instant'});
    render();
    return;
  }
  if(action==='scroll'){
    document.getElementById(el.dataset.target)?.scrollIntoView({behavior:'smooth'});
    return;
  }

  /* booking flow */
  if(action==='pick-cat'){
    state.booking.categoryId = el.dataset.id;
    render();
    return;
  }
  if(action==='pick-time'){
    state.booking.time = el.dataset.time;
    renderTimeSlots();
    document.querySelectorAll('.slot-btn').forEach(b=>b.classList.toggle('selected', b.dataset.time===state.booking.time));
    return;
  }
  if(action==='submit-booking'){
    await submitBooking();
    return;
  }
  if(action==='do-lookup'){
    const phoneInput = document.getElementById('lookupPhoneInput');
    const phone = phoneInput.value.trim();
    state.lookupPhone = phone;
    const norm = toStoragePhone(phone);
    try{
      const { data, error } = await sb.rpc('lookup_bookings_by_phone', { p_phone: norm });
      if(error) throw error;
      state.lookupResults = (data||[]).sort((a,b)=>(a.date+a.time_slot).localeCompare(b.date+b.time_slot));
    }catch(err){
      console.error(err);
      state.lookupResults = [];
    }
    render();
    return;
  }
  if(action==='cancel-own-booking'){
    if(!confirm("Bu randevuyu iptal etmek istediğine emin misin?")) return;
    const id = el.dataset.id;
    const norm = toStoragePhone(state.lookupPhone);
    const { error } = await sb.rpc('cancel_booking', { p_id: id, p_phone: norm });
    if(error){
      if(error.message && error.message.includes('TOO_LATE')){
        alert("Derse 2 günden az kaldığı için bu randevu artık iptal edilemez.");
      } else if(error.message && error.message.includes('NOT_FOUND')){
        alert("Randevu bulunamadı ya da telefon numarası eşleşmiyor.");
      } else {
        console.error(error);
        alert("İptal işlemi başarısız oldu, lütfen tekrar dene.");
      }
      return;
    }
    state.lookupResults = (state.lookupResults||[]).map(r=> r.id===id ? {...r, status:'iptal'} : r);
    render();
    return;
  }

  /* admin login/logout */
  if(action==='do-admin-login'){
    const now = Date.now();
    if(now < state.lockUntil){
      const secs = Math.ceil((state.lockUntil-now)/1000);
      document.getElementById('loginMsg').innerHTML = `<div class="msg err">Çok fazla hatalı deneme yapıldı. ${secs} saniye sonra tekrar dene.</div>`;
      return;
    }
    const email = document.getElementById('adminEmailInput').value.trim();
    const pass = document.getElementById('adminPasswordInput').value;
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(!error && data && data.user){
      state.isAdmin = true;
      state.adminEmail = data.user.email;
      state.loginAttempts = 0;
      await refreshBookings();
      render();
    } else {
      state.loginAttempts += 1;
      if(state.loginAttempts >= MAX_LOGIN_ATTEMPTS){
        state.lockUntil = Date.now() + LOCKOUT_MS;
        state.loginAttempts = 0;
        document.getElementById('loginMsg').innerHTML = `<div class="msg err">Çok fazla hatalı deneme. 60 saniye bekle.</div>`;
      } else {
        document.getElementById('loginMsg').innerHTML = `<div class="msg err">E-posta veya şifre yanlış. (${MAX_LOGIN_ATTEMPTS - state.loginAttempts} deneme hakkı kaldı)</div>`;
      }
    }
    return;
  }
  if(action==='admin-logout'){
    await sb.auth.signOut();
    state.isAdmin = false;
    state.adminEmail = null;
    state.view = 'home';
    render();
    return;
  }
  if(action==='admin-tab'){
    state.adminTab = el.dataset.tab;
    if(state.adminTab==='bookings' || state.adminTab==='availability') await refreshBookings();
    render();
    return;
  }

  /* haftalık randevu takvimi gezinme */
  if(action==='avail-week-prev'){
    state.adminAvailWeekStart = addDaysISO(state.adminAvailWeekStart, -7);
    render();
    return;
  }
  if(action==='avail-week-next'){
    state.adminAvailWeekStart = addDaysISO(state.adminAvailWeekStart, 7);
    render();
    return;
  }
  if(action==='avail-week-today'){
    state.adminAvailWeekStart = mondayOfWeekISO(todayISO());
    render();
    return;
  }

  /* admin bookings */
  if(action==='booking-status'){
    const id = el.dataset.id, status = el.dataset.status;
    const { error } = await sb.from('bookings').update({ status }).eq('id', id);
    if(!error){
      state.bookings = state.bookings.map(b=> b.id===id ? {...b, status} : b);
    } else { console.error(error); }
    render();
    return;
  }
  if(action==='booking-delete'){
    const id = el.dataset.id;
    const { error } = await sb.from('bookings').delete().eq('id', id);
    if(!error){
      state.bookings = state.bookings.filter(b=>b.id!==id);
    } else { console.error(error); }
    render();
    return;
  }
  if(action==='make-recurring'){
    await makeRecurring(el.dataset.id);
    return;
  }
  if(action==='stop-recurring'){
    await stopRecurring(el.dataset.groupid, el.dataset.id);
    return;
  }

  /* admin availability */
  if(action==='toggle-avail'){
    const day = el.dataset.day, time = el.dataset.time;
    const list = state.availability[day] || [];
    const newList = list.includes(time) ? list.filter(t=>t!==time) : [...list, time].sort();
    state.availability[day] = newList;
    render();
    const { error } = await sb.from('availability').upsert({ day, times: newList });
    if(error) console.error(error);
    return;
  }

  /* admin categories */
  if(action==='cat-add'){
    const name = document.getElementById('newCatName').value.trim();
    const levels = document.getElementById('newCatLevels').value.trim();
    const desc = document.getElementById('newCatDesc').value.trim();
    const msgEl = document.getElementById('catMsg');
    if(!name){ return; }
    const { error } = await sb.from('categories').insert({ id: uid(), name, levels: levels||"—", description: desc||"" });
    if(error){ msgEl.innerHTML = '<div class="msg err">Kategori eklenemedi.</div>'; console.error(error); return; }
    const { data } = await sb.from('categories').select('*').order('id');
    state.categories = data || [];
    render();
    return;
  }
  if(action==='cat-delete'){
    const id = el.dataset.id;
    const { error } = await sb.from('categories').delete().eq('id', id);
    if(!error){ state.categories = state.categories.filter(c=>c.id!==id); }
    else console.error(error);
    render();
    return;
  }

  /* admin profile */
  if(action==='save-profile'){
    await saveProfile();
    return;
  }

  /* admin security */
  if(action==='change-admin-password'){
    const p1 = document.getElementById('newAdminPassword').value;
    const p2 = document.getElementById('newAdminPasswordConfirm').value;
    const msgEl = document.getElementById('securityMsg');
    if(p1.length < 6){ msgEl.innerHTML = '<div class="msg err">Şifre en az 6 karakter olmalı.</div>'; return; }
    if(p1 !== p2){ msgEl.innerHTML = '<div class="msg err">Şifreler eşleşmiyor.</div>'; return; }
    const { error } = await sb.auth.updateUser({ password: p1 });
    if(!error){
      msgEl.innerHTML = '<div class="msg ok">Şifre güncellendi.</div>';
      document.getElementById('newAdminPassword').value = '';
      document.getElementById('newAdminPasswordConfirm').value = '';
    } else {
      msgEl.innerHTML = '<div class="msg err">Kaydedilemedi: '+escapeHtml(error.message||'')+'</div>';
    }
    return;
  }
}

async function makeRecurring(bookingId){
  const original = state.bookings.find(b=>b.id===bookingId);
  if(!original) return;
  const weeksInput = window.prompt("Bu randevu kaç hafta boyunca aynı gün/saatte otomatik tekrarlansın?", "12");
  if(weeksInput===null) return;
  const weeks = Math.max(1, Math.min(52, parseInt(weeksInput,10)||0));
  if(!weeks) return;

  const groupId = original.recurring_group_id || (crypto.randomUUID ? crypto.randomUUID() : uid()+uid());
  const existing = state.bookings.filter(b=>b.status!=='iptal');
  const toInsert = [];
  const skipped = [];

  for(let i=1;i<=weeks;i++){
    const newDate = addDaysISO(original.date, 7*i);
    const conflict = existing.some(b=>b.date===newDate && b.time_slot===original.time_slot) || toInsert.some(b=>b.date===newDate && b.time_slot===original.time_slot);
    if(conflict){ skipped.push(newDate); continue; }
    toInsert.push({
      category_id: original.category_id, date: newDate, time_slot: original.time_slot,
      role: original.role, name: original.name, grade: original.grade, phone: original.phone,
      note: original.note, status: 'onaylandı', is_recurring: true, recurring_group_id: groupId
    });
  }

  if(toInsert.length>0){
    const { error: insErr } = await sb.from('bookings').insert(toInsert);
    if(insErr){ console.error(insErr); alert("Tekrarlayan randevular oluşturulurken hata oldu."); return; }
  }
  const { error: updErr } = await sb.from('bookings').update({ is_recurring:true, recurring_group_id: groupId }).eq('id', bookingId);
  if(updErr) console.error(updErr);

  await refreshBookings();
  render();
  let msg = `${toInsert.length} hafta için randevu ayrıldı.`;
  if(skipped.length>0) msg += `\n${skipped.length} hafta zaten dolu olduğu için atlandı: ` + skipped.map(formatDayShortTR).join(", ");
  alert(msg);
}

async function stopRecurring(groupId, currentId){
  if(!confirm("Bu haftalık tekrarı durdurmak istiyor musun? Bugünden sonraki, henüz gerçekleşmemiş tüm tekrar randevuları silinecek.")) return;
  const today = todayISO();
  if(groupId){
    const { error } = await sb.from('bookings').delete().eq('recurring_group_id', groupId).gt('date', today);
    if(error) console.error(error);
    const { error: updErr } = await sb.from('bookings').update({ is_recurring:false }).eq('recurring_group_id', groupId).lte('date', today);
    if(updErr) console.error(updErr);
  } else {
    const { error } = await sb.from('bookings').update({ is_recurring:false }).eq('id', currentId);
    if(error) console.error(error);
  }
  await refreshBookings();
  render();
}

async function submitBooking(){
  const b = state.booking;
  b.role = document.querySelector('input[name="roleRadio"]:checked').value;
  b.name = document.getElementById('bookingName').value.trim();
  b.grade = document.getElementById('bookingGrade').value;
  b.phone = document.getElementById('bookingPhone').value.trim();
  b.note = document.getElementById('bookingNote').value.trim();
  b.date = document.getElementById('bookingDate').value;

  const msgEl = document.getElementById('bookingMsg');
  if(!b.categoryId){ msgEl.innerHTML = '<div class="msg err">Lütfen bir ders kategorisi seç.</div>'; window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(!b.date){ msgEl.innerHTML = '<div class="msg err">Lütfen bir tarih seç.</div>'; return; }
  if(!b.time){ msgEl.innerHTML = '<div class="msg err">Lütfen bir saat seç.</div>'; return; }
  if(!b.name){ msgEl.innerHTML = '<div class="msg err">Lütfen ad soyad gir.</div>'; return; }
  if(!b.phone){ msgEl.innerHTML = '<div class="msg err">Lütfen telefon numarası gir.</div>'; return; }
  if(!isValidTRPhone(b.phone)){ msgEl.innerHTML = '<div class="msg err">Telefon numarasını 05xx xxx xx xx formatında gir.</div>'; return; }

  const storagePhone = toStoragePhone(b.phone);
  const { data, error } = await sb.rpc('create_booking', {
    p_category_id: b.categoryId,
    p_date: b.date,
    p_time: b.time,
    p_role: b.role,
    p_name: b.name,
    p_grade: b.grade,
    p_phone: storagePhone,
    p_note: b.note
  });

  if(error){
    if(error.message && error.message.includes('SLOT_TAKEN')){
      msgEl.innerHTML = '<div class="msg err">Bu saat az önce başka biri tarafından alındı. Lütfen başka bir saat seç.</div>';
      b.time = null;
      b.freeTimes = await loadFreeTimesForDate(b.date);
      render();
    } else {
      console.error(error);
      msgEl.innerHTML = '<div class="msg err">Randevu oluşturulamadı, lütfen tekrar dene.</div>';
    }
    return;
  }

  const catNameForMail = catById(b.categoryId)?.name;
  const bookingForMail = { date:b.date, time:b.time, role:b.role, name:b.name, grade:b.grade, phone:storagePhone, note:b.note };
  notifyAdminNewBooking(bookingForMail, catNameForMail);

  state.booking = { categoryId:null, date:"", time:null, role:"ogrenci", name:"", grade:"", phone:"", note:"", freeTimes:null, slotsLoading:false };
  render();
  const newMsgEl = document.getElementById('bookingMsg');
  if(newMsgEl) newMsgEl.innerHTML = `<div class="msg ok">Randevu talebin alındı. Hoca onayladığında randevu durumu güncellenecek — durumu "Randevu Sorgula" sayfasından telefon numaranla takip edebilirsin.</div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

async function saveProfile(){
  const t = state.tutorInfo;
  t.name = document.getElementById('adminNameInput').value.trim() || t.name;
  t.title = document.getElementById('adminTitleInput').value.trim();
  t.bio = document.getElementById('adminBioInput').value.trim();
  t.experience = document.getElementById('adminExpInput').value.trim();
  t.students = document.getElementById('adminStudentsInput').value.trim();
  t.phone = document.getElementById('adminPhoneInput').value.trim();
  t.achievements = document.getElementById('adminAchvInput').value.split("\n").map(s=>s.trim()).filter(Boolean);

  const fileInput = document.getElementById('adminPhotoInput');
  if(fileInput && fileInput.files && fileInput.files[0]){
    const file = fileInput.files[0];
    if(file.size > 3 * 1024 * 1024){
      const msgEl2 = document.getElementById('profileMsg');
      if(msgEl2) msgEl2.innerHTML = '<div class="msg err">Fotoğraf çok büyük (maks. 3MB). Lütfen daha küçük bir dosya seç.</div>';
      return;
    }
    const dataUrl = await new Promise((res, rej)=>{
      const r = new FileReader();
      r.onload = ()=>res(r.result);
      r.onerror = ()=>rej(new Error("okuma hatası"));
      r.readAsDataURL(file);
    }).catch(()=>null);
    if(dataUrl) t.photo = dataUrl;
  }

  const { error } = await sb.from('tutor_info').update({
    name: t.name, title: t.title, bio: t.bio, experience: t.experience,
    students: t.students, phone: t.phone, achievements: t.achievements, photo: t.photo
  }).eq('id', 1);

  const msgEl = document.getElementById('profileMsg');
  msgEl.innerHTML = !error ? '<div class="msg ok">Bilgiler kaydedildi.</div>' : '<div class="msg err">Kaydedilemedi, tekrar dene.</div>';
  if(error) console.error(error);
  render();
}

  if(e.target && e.target.name==='roleRadio'){
    state.booking.role = e.target.value;
    const lbl = document.getElementById('nameLabel');
    if(lbl) lbl.textContent = state.booking.role==='veli' ? 'Veli Adı Soyadı' : 'Öğrenci Adı Soyadı';
  }
  if(e.target && e.target.id==='bookingDate'){
    const dateVal = e.target.value;
    state.booking.date = dateVal;
    state.booking.time = null;
    state.booking.freeTimes = null;
    state.booking.slotsLoading = true;
    renderTimeSlots();
    if(dateVal){
      state.booking.freeTimes = await loadFreeTimesForDate(dateVal);
    } else {
      state.booking.freeTimes = [];
    }
    state.booking.slotsLoading = false;
    renderTimeSlots();
  }
  if(e.target && e.target.id==='adminPhotoInput' && e.target.files && e.target.files[0]){
    const reader = new FileReader();
    reader.onload = ()=>{
      const wrap = e.target.closest('.photo-upload-row');
      let img = wrap.querySelector('img.photo-preview-sm');
      if(!img){
        img = document.createElement('img');
        img.className = 'photo-preview-sm';
        wrap.querySelector('.photo-preview-sm')?.remove();
        wrap.prepend(img);
      }
      img.src = reader.result;
    };
    reader.readAsDataURL(e.target.files[0]);
  }
});

document.addEventListener('click', handleClick);

/* ============================= INIT ============================= */
(async function init(){
  if(!supabaseConfigured){ state.loading = false; render(); return; }
  await loadAll();
  render();
})();
</script>
</body>
</html>
